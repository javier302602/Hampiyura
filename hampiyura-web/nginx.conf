# nginx dentro del contenedor del frontend: sirve la SPA compilada y reenvía /api y /uploads a la API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;   # el backend acepta imágenes en base64 dentro de JSON (hasta 8 MB)

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri /index.html;   # React Router
    }
}
